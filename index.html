<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="siteTitleTag">Futuristic Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f0ff;
      --primary-rgb: 0, 240, 255;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --bg: #070913;
      --surface: rgba(14, 18, 36, 0.75);
      --border: rgba(0, 240, 255, 0.25);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --glow: 0 0 25px rgba(var(--primary-rgb), 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
    }

    h1, h2, h3, .heading-font { font-family: var(--font-heading); }

    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(circle at 15% 20%, rgba(var(--primary-rgb), 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(112, 0, 255, 0.15) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 45px 45px, 45px 45px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 8%;
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .brand span { color: var(--primary); text-shadow: var(--glow); }

    .btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.65rem 1.4rem;
      border: 1px solid var(--primary);
      border-radius: 4px;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }

    .btn-solid { background: var(--primary); color: #000; font-weight: 700; }

    .hero {
      padding: 6rem 8% 4rem;
      text-align: center;
      max-width: 950px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1.2rem;
      font-size: 0.8rem;
      font-family: var(--font-heading);
      color: var(--primary);
      border: 1px solid var(--primary);
      background: rgba(var(--primary-rgb), 0.08);
      border-radius: 50px;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 3.8rem);
      line-height: 1.2;
      margin-bottom: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 35px rgba(var(--primary-rgb), 0.3);
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 2.5rem;
    }

    .courses-section {
      padding: 3rem 8% 6rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 3rem;
      text-align: center;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
    }

    .section-title::before, .section-title::after {
      content: "";
      height: 1px;
      width: 50px;
      background: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .course-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .course-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(var(--primary-rgb), 0.18);
    }

    .course-thumb {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .course-content {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-top h3 { font-size: 1.35rem; color: #fff; margin-bottom: 1rem; }
    .card-body { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; flex-grow: 1; white-space: pre-line; }
    
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .course-price {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.3);
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      padding: 2.5rem 8%;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>

  <header>
    <a href="index.html" class="brand heading-font">
      <span id="siteLogo">❖</span> <span id="brandName">AETHER ACADEMY</span>
    </a>
    <div>
      <a href="settings.html" class="btn">⚙ Settings</a>
    </div>
  </header>

  <section class="hero">
    <div class="badge">SYSTEM READY // ACADEMY ACTIVE</div>
    <h1 id="heroHeadline">Master the Code of the Future</h1>
    <p id="heroSubline">Explore structured modules, hands-on programming paradigms, and high-impact curriculum designed for the next generation.</p>
    <a href="#courses" class="btn btn-solid">Explore Courses</a>
  </section>

  <section class="courses-section" id="courses">
    <h2 class="section-title">Available Courses</h2>
    <div class="grid" id="courseGrid"></div>
  </section>

  <footer>
    <p>&copy; <span id="year"></span> <span id="footerBrand">Aether Academy</span>. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    async function loadSiteData() {
      let data = null;

      try {
        const res = await fetch('data.json?t=' + Date.now());
        if (res.ok) data = await res.json();
      } catch (e) {
        console.warn('Network request for data.json failed; checking browser fallback cache.', e);
      }

      if (!data) {
        const cached = localStorage.getItem('siteExportData');
        if (cached) data = JSON.parse(cached);
      }

      if (!data) return;

      const cfg = data.config;
      if (cfg) {
        if (cfg.brand) {
          document.getElementById('brandName').textContent = cfg.brand;
          document.getElementById('footerBrand').textContent = cfg.brand;
          document.getElementById('siteTitleTag').textContent = `${cfg.brand} // Academy`;
        }
        if (cfg.heading) document.getElementById('heroHeadline').textContent = cfg.heading;
        if (cfg.color) {
          document.documentElement.style.setProperty('--primary', cfg.color);
          document.documentElement.style.setProperty('--primary-rgb', hexToRgb(cfg.color));
        }
        if (cfg.headingFont) document.documentElement.style.setProperty('--font-heading', cfg.headingFont);
        if (cfg.bodyFont) document.documentElement.style.setProperty('--font-body', cfg.bodyFont);
        document.body.style.fontWeight = cfg.bodyWeight || '300';
      }

      const courses = data.courses || [];
      const grid = document.getElementById('courseGrid');
      grid.innerHTML = '';

      courses.forEach(c => {
        const card = document.createElement('div');
        card.className = 'course-card';
        
        const imgHtml = c.image 
          ? `<img src="${c.image}" alt="${c.title}" class="course-thumb" onerror="this.style.display='none'" />` 
          : '';

        card.innerHTML = `
          ${imgHtml}
          <div class="course-content">
            <div class="card-top"><h3>${c.title}</h3></div>
            <div class="card-body"><p>${c.desc}</p></div>
            <div class="card-bottom">
              <span class="course-price">${c.price}</span>
              <button class="btn">Enroll</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', loadSiteData);
  </script>
</body>
</html>
