<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Style Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00f0ff;
      --primary-rgb: 0, 240, 255;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
      --font-weight-body: 300;
      --font-weight-heading: 800;
      --bg: #080a14;
      --surface: rgba(15, 20, 38, 0.85);
      --border: rgba(0, 240, 255, 0.22);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --glow: 0 0 25px rgba(var(--primary-rgb), 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: var(--font-weight-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    h1, h2, h3, .heading-font {
      font-family: var(--font-heading);
      font-weight: var(--font-weight-heading);
      letter-spacing: -0.01em;
    }

    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(circle at 15% 20%, rgba(var(--primary-rgb), 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(112, 0, 255, 0.15) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 45px 45px, 45px 45px;
    }

    .top-bar {
      width: 100%;
      max-width: 750px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      margin-top: 1.5rem;
    }

    .btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.65rem 1.4rem;
      border: 1px solid var(--primary);
      border-radius: 6px;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
    }

    .btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: var(--glow);
    }

    .btn-solid {
      background: var(--primary);
      color: #000;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-heading);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }

    .form-input, .form-select {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-select {
      background-color: #0d1222;
      cursor: pointer;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .error-msg {
      color: #ff3366;
      font-size: 0.85rem;
      margin-top: 0.6rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>

  <div class="top-bar">
    <a href="index.html" class="btn">← Back to Site</a>
    <span class="heading-font" style="color: var(--primary); font-size: 0.85rem; font-weight: 800;">SITE SETTINGS</span>
  </div>

  <div class="container" id="loginContainer" style="max-width: 450px;">
    <h2 class="heading-font" style="margin-bottom: 1.5rem; color: #fff;">Admin Authorization</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="adminUser" class="form-input" placeholder="admin" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPass" class="form-input" placeholder="•••••" />
    </div>
    <div class="error-msg" id="loginError">Access denied. Invalid credentials.</div>
    <button class="btn btn-solid" style="width: 100%; margin-top: 1rem;" onclick="attemptLogin()">Unlock Portal</button>
  </div>

  <div class="container" id="designDashboard" style="display: none;">
    <h2 class="heading-font" style="margin-bottom: 1.5rem; color: var(--primary); font-size: 1.3rem;">Visual & Brand Settings</h2>

    <div class="form-group">
      <label>Website Name / Academy Brand</label>
      <input type="text" id="setBrandName" class="form-input" />
    </div>
    
    <div class="form-group">
      <label>Main Headline</label>
      <input type="text" id="setHeroHeading" class="form-input" />
    </div>

    <div class="form-group">
      <label>Heading Font Family</label>
      <select id="setHeadingFont" class="form-select">
        <option value="'Montserrat', sans-serif">Montserrat Bold (Default)</option>
        <option value="'Ubuntu', sans-serif">Ubuntu Bold</option>
        <option value="'Open Sans', sans-serif">Open Sans Bold</option>
      </select>
    </div>

    <div class="form-group">
      <label>Body Text Font Family</label>
      <select id="setBodyFont" class="form-select">
        <option value="'Montserrat', sans-serif">Montserrat Light (Default)</option>
        <option value="'Ubuntu', sans-serif">Ubuntu Light/Regular</option>
        <option value="'Open Sans', sans-serif">Open Sans Light/Regular</option>
      </select>
    </div>

    <div class="form-group">
      <label>Glow / Accent Color</label>
      <input type="color" id="setColor" class="form-input" style="height: 48px; padding: 4px; cursor: pointer;" />
    </div>

    <button class="btn btn-solid" style="width: 100%; margin-top: 1rem;" onclick="saveDesignSettings()">Apply Style Updates</button>
  </div>

  <script>
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    function syncTheme() {
      let headingFont = "'Montserrat', sans-serif";
      let bodyFont = "'Montserrat', sans-serif";
      let headingWeight = "800";
      let bodyWeight = "300";

      const savedConfig = localStorage.getItem('siteConfig');
      if (savedConfig) {
        try {
          const config = JSON.parse(savedConfig);
          if (config.color) {
            document.documentElement.style.setProperty('--primary', config.color);
            document.documentElement.style.setProperty('--primary-rgb', hexToRgb(config.color));
          }
          if (config.headingFont) {
            headingFont = config.headingFont;
            headingWeight = headingFont.includes('Montserrat') ? "800" : "700";
          }
          if (config.bodyFont) {
            bodyFont = config.bodyFont;
            bodyWeight = bodyFont.includes('Montserrat') ? "300" : "400";
          }
        } catch (e) {
          console.error(e);
        }
      }

      document.documentElement.style.setProperty('--font-heading', headingFont);
      document.documentElement.style.setProperty('--font-body', bodyFont);
      document.documentElement.style.setProperty('--font-weight-heading', headingWeight);
      document.documentElement.style.setProperty('--font-weight-body', bodyWeight);
    }

    function attemptLogin() {
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      const errorMsg = document.getElementById('loginError');

      if (user === 'admin' && pass === '12345') {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('designDashboard').style.display = 'block';
        loadSettings();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function loadSettings() {
      const savedConfig = localStorage.getItem('siteConfig');
      if (savedConfig) {
        const config = JSON.parse(savedConfig);
        document.getElementById('setBrandName').value = config.brand || 'AETHER ACADEMY';
        document.getElementById('setHeroHeading').value = config.heading || 'Master the Code of the Future';
        document.getElementById('setHeadingFont').value = config.headingFont || "'Montserrat', sans-serif";
        document.getElementById('setBodyFont').value = config.bodyFont || "'Montserrat', sans-serif";
        document.getElementById('setColor').value = config.color || '#00f0ff';
      } else {
        document.getElementById('setBrandName').value = 'AETHER ACADEMY';
        document.getElementById('setHeroHeading').value = 'Master the Code of the Future';
        document.getElementById('setHeadingFont').value = "'Montserrat', sans-serif";
        document.getElementById('setBodyFont').value = "'Montserrat', sans-serif";
        document.getElementById('setColor').value = '#00f0ff';
      }
    }

    function saveDesignSettings() {
      const brand = document.getElementById('setBrandName').value.trim();
      const heading = document.getElementById('setHeroHeading').value.trim();
      const headingFont = document.getElementById('setHeadingFont').value;
      const bodyFont = document.getElementById('setBodyFont').value;
      const color = document.getElementById('setColor').value;

      const config = { brand, heading, headingFont, bodyFont, color };
      localStorage.setItem('siteConfig', JSON.stringify(config));

      alert('Design settings saved! Redirecting to home...');
      window.location.href = 'index.html';
    }

    window.addEventListener('DOMContentLoaded', syncTheme);
  </script>
</body>
</html>
